name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Installer Java (nécessaire pour Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Synchroniser le projet Capacitor
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Construire l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Récupérer l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: handball-tournament-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
